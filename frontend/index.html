<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the ride screen runs under the status bar of a home screen web app -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- "Add to Home Screen" on the iPad opens OpenRide without Safari's address bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenRide" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OpenRide</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
