; OpenRide trainer bridge: ESP32 between a Kettler (Bluetooth Classic) and the OpenRide web app (Wi-Fi + HTTP API).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Bluetooth Classic + Wi-Fi + web server do not fit the default 1.2 MB app partition
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7
